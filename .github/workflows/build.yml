# When CI runs, and how much of it. The jobs themselves are in ci.yml, which release.yml calls too.
#
#   a push to main, a pull request    the fast checks only: swift test and the zipped simulator app (about 4 minutes)
#   "Run workflow", the 1st monthly  the fast checks and the device suite on a simulator: screenshots, unit tests,
#                                     id walk, flows, tabs on an older iOS (about 50 minutes)
#
# A push or a pull request that changes only the files below starts nothing: no test, no build step and no script reads
# them. SPEC.md, nthcase/ (its scenarios' .md files included) and art/ are NOT here: MossgroveKit's tests read them.
#
# A newer push to the same branch or pull request cancels the older run. "Run workflow" and the monthly run are never
# cancelled by a push, and release.yml has no concurrency at all: a release always runs to its end.
name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - LICENSE
      - NOTICE
      - docs/screenshots/**
  pull_request:
    paths-ignore:
      - README.md
      - CONTRIBUTING.md
      - SECURITY.md
      - LICENSE
      - NOTICE
      - docs/screenshots/**
  workflow_dispatch:
  schedule:
    # 03:17 UTC on the 1st of each month: the device suite once a month, so drift in the runner's Xcode or simulators is still caught
    - cron: "17 3 1 * *"

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: build-${{ github.run_number }}
      devices: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

# On a v* tag: test, build the simulator app, and attach it to a GitHub Release.
#
# No secrets: a simulator app needs no signing certificate, so there is no .ipa. The token is the run's own
# GITHUB_TOKEN, and only the release job can write.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: xcodebuild -version
      - run: swift test --package-path MossgroveKit
      - name: Build, zip and check mossgrove-ios-<tag>-simulator.zip
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package-simulator-app.sh "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --title "Mossgrove for iOS $TAG" \
            --notes "The Mossgrove sample app built for the iOS Simulator (arm64 and x86_64, iOS 17 or later), for testing with NthCase. Unzip it, then install it on a simulator named by its UDID: xcrun simctl install <udid> Mossgrove.app. SHA256SUMS lists the zip's checksum."

# On a v* tag: every check (ci.yml, the fast checks and the device suite on a simulator), and only when all of them
# are green, the GitHub Release with the zipped simulator app and SHA256SUMS. A red check publishes nothing.
#
# No concurrency: a release is never cancelled halfway.
#
# No secrets: a simulator app needs no signing certificate, so there is no .ipa. The token is the run's own
# GITHUB_TOKEN, and only the release job can write.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}
      devices: true

  github-release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-ios-simulator
          path: dist
      - name: Create the release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* --repo "$REPO" --title "Mossgrove for iOS $TAG" \
            --notes "The Mossgrove sample app built for the iOS Simulator (arm64 and x86_64, iOS 17 or later), for testing with NthCase. Unzip it, then install it on a simulator named by its UDID: xcrun simctl install <udid> Mossgrove.app. SHA256SUMS lists the zip's checksum."
